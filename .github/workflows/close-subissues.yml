name: Close Sub-issues

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  close-subissues:
    runs-on: ubuntu-latest

    steps:
      - name: Close sub-issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PARENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          echo "========================================="
          echo "Issue pai fechada: #$PARENT_ISSUE"
          echo "Repositório: $REPO"
          echo "========================================="

          echo "Buscando sub-issues..."

          SUBISSUES=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/issues/$PARENT_ISSUE/sub_issues" \
            --jq '.[] | select(.state == "open") | .number')

          if [ -z "$SUBISSUES" ]; then
            echo "Nenhuma sub-issue aberta encontrada."
            exit 0
          fi

          echo "Sub-issues abertas encontradas:"
          echo "$SUBISSUES"

          for ISSUE in $SUBISSUES; do
            echo ""
            echo "Fechando sub-issue #$ISSUE..."

            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/issues/$ISSUE" \
              -f state='closed'

            echo "Sub-issue #$ISSUE fechada com sucesso."
          done

          echo ""
          echo "========================================="
          echo "Processo concluído."
          echo "========================================="
